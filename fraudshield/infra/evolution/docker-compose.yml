# Manee's OWN WhatsApp gateway (Evolution API). Separate from any other Evolution instance on this machine:
# its own containers, volumes, database and port (8081). Uses the public open-source image.
#
#   1. copy .env.example to .env and fill in the three secrets (see the comments there)
#   2. docker compose --env-file .env up -d        (run inside this folder)
#   3. open http://localhost:8081/manager and log in with EVOLUTION_API_KEY
name: manee-evolution

services:
  evolution:
    image: atendai/evolution-api:v2.1.1
    restart: unless-stopped
    depends_on: [postgres, redis]
    ports:
      - "127.0.0.1:8081:8080" # local only
    environment:
      SERVER_URL: http://localhost:8081
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1056020247" # WhatsApp rejects a stale version, which means no QR code
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://manee:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: manee
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - manee_evolution_instances:/evolution/instances
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets the container call the Manee backend running on the host

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: manee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: evolution
    volumes:
      - manee_evolution_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - manee_evolution_redis:/data

volumes:
  manee_evolution_instances:
  manee_evolution_pg:
  manee_evolution_redis:
