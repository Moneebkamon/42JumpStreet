# Brand registry. VERIFY every official domain before relying on it.
# keywords: words scammers combine with the brand name.
brands:
  - id: adcb
    name_en: Abu Dhabi Commercial Bank
    name_ar: بنك أبوظبي التجاري
    category: bank
    official_domains: [adcb.com]
    keywords: [adcb, abudhabicommercial, login, secure]
  - id: fab
    name_en: First Abu Dhabi Bank
    name_ar: بنك أبوظبي الأول
    category: bank
    official_domains: [bankfab.com]
    keywords: [fab, bankfab, firstabudhabi, login]
  - id: enbd
    name_en: Emirates NBD
    name_ar: بنك الإمارات دبي الوطني
    category: bank
    official_domains: [emiratesnbd.com]
    keywords: [emiratesnbd, enbd, login, secure]
  - id: mashreq
    name_en: Mashreq Bank
    name_ar: بنك المشرق
    category: bank
    official_domains: [mashreq.com]
    keywords: [mashreq, login]
  - id: adib
    name_en: Abu Dhabi Islamic Bank
    name_ar: مصرف أبوظبي الإسلامي
    category: bank
    official_domains: [adib.ae]
    keywords: [adib, login]
  - id: dib
    name_en: Dubai Islamic Bank
    name_ar: بنك دبي الإسلامي
    category: bank
    official_domains: [dib.ae]
    keywords: [dib, dubaiislamic, login]
  - id: adpolice
    name_en: Abu Dhabi Police
    name_ar: شرطة أبوظبي
    category: government
    official_domains: [adpolice.gov.ae]
    keywords: [adpolice, police, fine, traffic]
  - id: moi
    name_en: Ministry of Interior
    name_ar: وزارة الداخلية
    category: government
    official_domains: [moi.gov.ae]
    keywords: [moi, interior, fine]
  - id: tamm
    name_en: TAMM Abu Dhabi
    name_ar: تم أبوظبي
    category: government
    official_domains: [tamm.abudhabi]
    ignore_words: [tammy, tammie]  # first names, not an impersonation
    keywords: [tamm, abudhabi, gov]
  - id: icp
    name_en: Federal Authority for Identity and Citizenship
    name_ar: الهيئة الاتحادية للهوية والجنسية
    category: government
    official_domains: [icp.gov.ae]
    keywords: [icp, emiratesid, identity]
  - id: salik
    name_en: Salik
    name_ar: سالك
    category: government
    official_domains: [salik.gov.ae]
    keywords: [salik, toll, recharge]
  - id: etisalat
    name_en: e& (Etisalat)
    name_ar: اتصالات من e&
    category: telecom
    official_domains: [etisalat.ae, eand.com]
    tokens: [etisalat, eand]
    exact_only: [eand]  # 'eand' inside words (timeanddate, theglobeandmail) is not an impersonation
    keywords: [etisalat, eand, bill, recharge]
  - id: du
    name_en: du
    name_ar: دو
    category: telecom
    official_domains: [du.ae]
    keywords: [du, bill, recharge]
  - id: emirates
    name_en: Emirates Airline
    name_ar: طيران الإمارات
    category: airline
    official_domains: [emirates.com]
    keywords: [emirates, tickets, skywards]
  - id: etihad
    name_en: Etihad Airways
    name_ar: الاتحاد للطيران
    category: airline
    official_domains: [etihad.com]
    keywords: [etihad, tickets, guest]
  - id: aramex
    name_en: Aramex
    name_ar: أرامكس
    category: delivery
    official_domains: [aramex.com]
    keywords: [aramex, parcel, delivery, tracking]
  - id: dhl
    name_en: DHL
    name_ar: دي إتش إل
    category: delivery
    official_domains: [dhl.com]
    keywords: [dhl, parcel, delivery, tracking]

