<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sunrise Bakery - Customer Login</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <h1>Sunrise Bakery</h1>
  <p>Log in to see your orders. Please act now if your order needs changes before it ships.</p>
  <form action="/login" method="post">
    <input type="email" name="email">
    <input type="password" name="password">
    <button type="submit">Log in</button>
  </form>
  <form action="https://search.example-search.test/q" method="get">
    <input type="text" name="q">
  </form>
  <img src="/img/cake.jpg" alt="Chocolate cake">
</body>
</html>
